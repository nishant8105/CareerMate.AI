<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interview Simulator — CareerMate AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 30px 20px 60px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 75%, rgba(123, 47, 247, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 18px;
    }
    .logo-link img {
      height: 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid rgba(0, 210, 255, 0.35);
      color: #00d2ff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    /* Progress Header */
    .sim-progress-box {
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      transition: width 0.4s ease;
    }

    /* Question Card */
    .question-card {
      background: rgba(20, 20, 35, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
    }
    .question-label {
      font-size: 12px;
      color: #00d2ff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .question-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.5;
    }

    /* Answer Area */
    .answer-card {
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .answer-textarea {
      width: 100%;
      height: 200px;
      background: rgba(10, 15, 29, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      padding: 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.3s;
    }
    .answer-textarea:focus {
      border-color: rgba(0, 210, 255, 0.6);
      background: rgba(10, 15, 29, 0.95);
    }
    .answer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-submit {
      background: linear-gradient(135deg, #00d2ff, #7b2ff7);
      color: #fff;
      border: none;
      padding: 14px 34px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 210, 255, 0.45);
    }
    .btn-skip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-skip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Header Navigation -->
    <div class="header-bar">
      <a href="/" class="logo-link">
        <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo">
        <span>CareerMate<span style="color: #00d2ff;">.AI</span></span>
      </a>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="badge">🤖 {{ session_data.role }}</span>
        <a href="/interview-prep" style="color: #94a3b8; font-size: 13px; text-decoration: none;">Exit Simulation ✕</a>
      </div>
    </div>

    <!-- Progress Indicator Card -->
    <div class="sim-progress-box">
      <div class="progress-meta">
        <span><strong>Question {{ progress.current }}</strong> of {{ progress.total }}</span>
        <span style="color: #00d2ff;">⏱ In Session: <span id="timer-display">00:00</span></span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: {{ progress.percent }}%;"></div>
      </div>
    </div>

    <!-- Active Question Form -->
    <form action="/interview-sim/answer" method="post" id="answer-form">
      <input type="hidden" name="session_id" value="{{ session_data.session_id }}">

      <!-- Question Card (Single visible question) -->
      <div class="question-card">
        <div class="question-label">
          <span>🎯 Interview Question #{{ progress.current }}</span>
        </div>
        <h1 class="question-title">{{ current_question }}</h1>
      </div>

      <!-- Answer Input Card -->
      <div class="answer-card">
        <label style="display: block; font-size: 13px; font-weight: 600; color: #00d2ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">
          Your Answer / Response
        </label>
        <textarea
          name="answer_text"
          id="answer-input"
          class="answer-textarea"
          placeholder="Type your response here... (Structure with STAR: Situation, Task, Action, Result)..."
          autofocus
          oninput="updateCount(this)"
        ></textarea>
        
        <div class="answer-meta">
          <span id="word-count-display">0 words | 0 characters</span>
          <span>Tip: Press Tab to focus, then Enter or click submit when ready.</span>
        </div>

        <div class="actions-bar">
          <button type="button" class="btn-skip" onclick="submitSkip()">⏩ Skip This Question</button>
          
          <button type="submit" class="btn-submit">
            {% if progress.is_last %}
              🏁 Complete Interview & Review Answers
            {% else %}
              Submit Answer & Continue →
            {% endif %}
          </button>
        </div>
      </div>
    </form>

  </div>

  <script>
    function updateCount(textarea) {
      const text = textarea.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById('word-count-display').textContent = `${words} words | ${chars} characters`;
    }

    function submitSkip() {
      const input = document.getElementById('answer-input');
      input.value = "(Skipped by candidate)";
      document.getElementById('answer-form').submit();
    }

    // Live Session Timer
    let secondsElapsed = 0;
    setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      const display = document.getElementById('timer-display');
      if (display) display.textContent = `${mins}:${secs}`;
    }, 1000);
  </script>
</body>
</html>
