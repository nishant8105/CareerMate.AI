<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — CareerMate AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(123, 47, 247, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-img {
      height: 42px;
      margin-bottom: 12px;
    }
    .auth-title {
      font-size: 24px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 13.5px;
      color: #94a3b8;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: rgba(10, 15, 29, 0.9);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #00d2ff;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff, #7b2ff7);
      color: #fff;
      border: none;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 210, 255, 0.45);
    }
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #00d2ff;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .flash-messages {
      margin-bottom: 18px;
    }
    .flash-msg {
      background: rgba(255, 77, 106, 0.2);
      border: 1px solid rgba(255, 77, 106, 0.4);
      color: #ff99aa;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <a href="/">
        <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Logo" class="logo-img">
      </a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Save your resumes, interview history & skill roadmaps</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for msg in messages %}
            <div class="flash-msg">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/register" method="post">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-input" placeholder="Alex Johnson" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password (Min 6 Characters)</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="submit" class="btn-submit">Create My Account</button>
    </form>

    <div class="auth-footer">
      <span>Already have an account? </span>
      <a href="/login">Sign In →</a>
    </div>
  </div>
</body>
</html>
